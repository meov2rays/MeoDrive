name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          npm install
          npm install three@0.160.0 --no-save

      - name: Prepare web folder (offline Three.js)
        run: |
          mkdir -p www/vendor/three
          cp index.html peugeot-405-glx.glb www/
          cp -r node_modules/three/build www/vendor/three/build
          cp -r node_modules/three/examples www/vendor/three/examples
          sed -i 's#https://cdn.jsdelivr.net/npm/three@0.160.0/#./vendor/three/#g' www/index.html
          grep -c "vendor/three" www/index.html

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android
          sed -i 's#android:name=".MainActivity"#android:name=".MainActivity" android:screenOrientation="sensorLandscape"#' android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: MeoDrive-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
